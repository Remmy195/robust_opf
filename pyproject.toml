[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ropf"
version = "1.0.0"
description = "Risk-aware optimal power flow by cutting planes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Remi Akinwonmi" }]
dependencies = ["amplpy>=0.15", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
study = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.scripts]
ropf = "ropf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
