# The preventive N-1 thermal screen against the frontier_v1 dispatches.
#
#     ropf score configs/frontier_campaign.conf --dry-run
#     ropf score configs/frontier_campaign.conf --all
#
# Diff this against configs/vendor_gamma0.conf: every Section 4 key is
# identical, and the ones that differ are marked CHANGED.  That is the point of
# the file -- the campaign is the same campaign run against different
# dispatches, so a difference in the numbers is a difference in the dispatches.
#
# WHAT IS BEING SCORED, AND WHY THESE DISPATCHES.  results/frontier_v1/ holds
# the phase-2 sweeps at kappa = 5, eta = 0.85, k-bar = 40, on a weight grid
# bisected per combo around lambda*.  Their cost overheads land where the study
# argues -- 1.57, 1.63, 1.70, 1.99, 2.00 percent, and on out to 26 -- where
# vendor_gamma0's fixed multiplier grid bunches: five of its six ACTIVSg200
# max_active_flow points buy the same 9.04 percent and the whole ACTIVSg2000
# sweep spans about one point.  Nothing was recomputed to get here; those
# dispatches existed and had never been scored.
#
# ALGORITHM 1 DOES NOT RUN, so this file sets none of its parameters.  kappa,
# eta, k_bar and weight_grid are not keys of a score config and naming one is an
# unknown-key error.  The weights scored are the ones each source sweep left
# behind, at the lambda* it measured.
#
# MOST OF THESE CELLS DID NOT CONVERGE.  `iteration_limit` is the termination of
# nearly every nonzero weight in this tree at k-bar = 40, exactly as it is in
# vendor_gamma0 at k-bar = 15; only ACTIVSg200 bus_flow_sum_agg exits
# `separation_exhausted`.  That is a property of the algorithm on these cases
# and not of the budget.  Every score run says so in its transcript, and
# source.json carries each weight's termination beside its overhead, so no
# number can be quoted off one of these cells without it.

frontier_dir    = results/frontier_v1   # CHANGED: the tree being scored
frontier_suffix = _frontier             # CHANGED: what those configs tagged with

instances = activs200, activs500, texas2k
metrics = max_active_flow, joule_loss_max, bus_flow_sum_agg
stages  = baseline
#
# THE STAGE AXIS IS CUT TO ONE POINT, AND NOT TO SAVE TIME.  Stages a2 and a3
# both solve (M^ac), and the AMPL Knitro licence on this machine expired
# 2025-11-09 (ampl.lic; the Gurobi entry runs to 2026-10-10).  The a2 trees in
# results/frontier_v1/ carry the DC dispatch as their result -- the closing
# (M^ac) solve failed and the reported dispatch fell back to it -- so scoring
# them would duplicate baseline, and there are no a3 trees at all.  Restore
# `stages = baseline, a2, a3` once Knitro is relicensed and those sweeps are
# rerun; nothing else in this file has to change.

# ---------------------------------------------------------------------------
# Section 4: the counterfactual campaign, class (c) only.
#
# Identical to configs/vendor_gamma0.conf, key for key, so the two trees are
# comparable.  The argument for gamma = 0 and for beta = 1 is written out there
# and in COUNTERFACTUAL_STANDARD.md sections 3.5 and 5.3, and is not restated
# here: two copies of an argument can drift.
# ---------------------------------------------------------------------------
gen_k      =          # class (a) off
walk_k     =          # class (b) off
walk_draws = 100      # unread with walk_k empty; left at the ladder's value
walk_seed  = 20260820
vendor_list = true
gamma      = 0        # preventive; the window pins Pg = P*
beta       = 1        # the case authors' own contingency rule

# ---------------------------------------------------------------------------
# Section 4.2: the frequency screen.
#
# NONE OF THE FOUR CONSTANTS BELOW IS DEFAULTED BY THE CODE. They are
# grid-code quantities and every one of them needs a citation before a number
# it produced goes into the paper. The values here are the conventional ones
# and are NOT yet sourced -- replace the CITE markers.  They are the same four
# values vendor_gamma0 ran at, and they have to stay that way for the two trees
# to be comparable.
# ---------------------------------------------------------------------------
f0_hz            = 60.0     # CITE: the .RAW BASFRQ field of the distribution
rocof_max_hz_s   = 0.5      # CITE: a grid-code RoCoF withstand limit
f_under_hz       = 59.3     # CITE: the first UFLS stage of the interconnection
damping_per_load = 1.0      # CITE: the textbook 1-2 %/%, on the LOAD base
horizon_s        = 30.0
dt_s             = 0.01

dynamics_search = data

# ---------------------------------------------------------------------------
# Solvers.  solver_ac is not a key here: no AC solve is reachable from `ropf
# score`, which runs (D) and nothing else.
# ---------------------------------------------------------------------------
solver_dc    = gurobi
threads      = 16
time_limit_s = 3600

outdir            = results/frontier_campaign   # CHANGED: not vendor_gamma0's tree
stale_claim_hours = 24
