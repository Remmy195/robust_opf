# Retry of the lambda = 2 lambda* frontier point from activs70k.conf, which
# returned 'solved?' (ambiguous Gurobi status) at k = 2. lambda* was reported
# as 59536092.710447 $/p.u. by that run, so lambda = 2 lambda* is set here as
# an absolute risk_weight to reproduce the single failing point.
case   = data/case_ACTIVSg70k.m
metric = joule_loss_max
stage  = baseline

kappa = 2
eta   = 0.8
k_bar = 15

risk_weight = 119072185.420894

solver_dc = gurobi
solver_ac = knitro
threads   = 16

gurobi_method       = barrier
gurobi_numericfocus = 3
gurobi_scaleflag    = 2

outdir = results/debug
tag    = lambda2_barrier
