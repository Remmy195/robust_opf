# One rung of the ladder study: ACTIVSg200, the max-active-flow functional,
# the DC baseline stage, swept over the full weight grid.
#
# Run it with:
#     ropf solve configs/activs200_flow_baseline.conf
#
# `ropf keys` lists every key.  An unknown key and a repeated key are errors.

case   = tests/fixtures/case_ACTIVSg200.m
metric = max_active_flow
stage  = baseline

# Algorithm 1: cut budget, target reduction, iteration limit.
kappa = 2
eta   = 0.8
k_bar = 15

# The grid of Section 5, as multiples of lambda* = z0/rho0.
weight_grid = 0, 0.25, 0.5, 1, 2, 4

solver_dc = gurobi
solver_ac = knitro
threads   = 8

outdir = results
