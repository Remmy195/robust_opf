# The ladder study: every instance, every functional, every stage.
#
#     ropf ladder configs/ladder.conf --dry-run   # what would run, and how big
#     ropf ladder configs/ladder.conf             # claim one combo and run it
#     ropf ladder configs/ladder.conf --all       # keep going until none left
#     ropf ladder configs/ladder.conf --status    # the progress table
#
# One invocation runs one (instance, metric, stage) combo. The combos are
# independent, so running this in several shells at once parallelizes the study
# and running it again after a crash resumes it.
#
# `ropf keys` lists the run-config keys; the keys below are the ladder's own.
# An unknown key and a repeated key are both errors.

instances   = activs200, activs500, texas2k, activs10k, activs25k, activs70k
metrics = max_active_flow, joule_loss_max, bus_flow_sum_agg
stages  = baseline, a2, a3

# ---------------------------------------------------------------------------
# Algorithm 1
# ---------------------------------------------------------------------------
kappa       = 2
eta         = 0.8
k_bar       = 15
weight_grid = 0, 0.25, 0.5, 1, 2, 4

# ---------------------------------------------------------------------------
# Section 4: the counterfactual campaign
#
# 6 weights x 1 gamma x (8 top-K + 3 x 100 walks) = 1,848 evaluations per
# combo. Adding a gamma multiplies that; --dry-run reports the total before
# anything is solved.
# ---------------------------------------------------------------------------
campaign   = true
gen_k      = 1, 2, 3, 5, 8, 12, 18, 25
walk_k     = 5, 15, 40
walk_draws = 100
walk_seed  = 20260820
gamma      = 0.5
beta       = 1.2      # a DECLARED 20% short-term overload, above the case's own rule
#
# The case's own rule is beta = 1: rateB and rateC are zero in every ACTIVSg
# .m, .aux and .RAW, so there is no per-branch emergency MAGNITUDE to read, but
# all six .aux files monitor contingencies against rate set "A" at 100 percent
# (data/ACTIVSg2000.aux:1281).  1.2 is therefore an assumption sitting above
# data, not a stand-in for missing data, and it must be labelled one wherever a
# number it produced is reported.  COUNTERFACTUAL_STANDARD.md sections 3.5 and
# 5.3.  `worst_loading` in campaign.csv does not mention beta, so this run can
# also be read at 1.

# ---------------------------------------------------------------------------
# Section 4.2: the frequency screen.
#
# NONE OF THE FOUR CONSTANTS BELOW IS DEFAULTED BY THE CODE. They are
# grid-code quantities and every one of them needs a citation before a number
# it produced goes into the paper. The values here are the conventional ones
# and are NOT yet sourced -- replace the CITE markers.
# ---------------------------------------------------------------------------
f0_hz            = 60.0     # CITE: the .RAW BASFRQ field of the distribution
rocof_max_hz_s   = 0.5      # CITE: a grid-code RoCoF withstand limit
f_under_hz       = 59.3     # CITE: the first UFLS stage of the interconnection
damping_per_load = 1.0      # CITE: the textbook 1-2 %/%, on the LOAD base
horizon_s        = 30.0
dt_s             = 0.01

# Where each instance's .dyr and .aux are found. Unpacked beside the cases this is
# `data`; it can equally name the directory holding the ACTIVSg archives, since
# the .dyr and .aux are read from inside a zip without unpacking it.
dynamics_search = data

# ---------------------------------------------------------------------------
# Solvers.
#
# threads is the PHYSICAL core count, not the logical one. A thread per
# logical cpu made one (D) evaluation on ACTIVSg70k 5.7x slower for an answer
# that agreed to nine significant figures.
# ---------------------------------------------------------------------------
solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

outdir            = results/ladder
stale_claim_hours = 24
