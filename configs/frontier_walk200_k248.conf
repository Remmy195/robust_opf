# Class (b), the random-walk component sets, against the frontier_v1 dispatches
# on ACTIVSg200.
#
#     ropf score configs/frontier_walk200_k248.conf --dry-run
#     ropf score configs/frontier_walk200_k248.conf --all
#
# configs/frontier_walk200.conf at the ACTIVSg500 walk grid; walk_k and outdir
# are the only keys that move.  See analysis/FINDING_walk200_no_signal.md.
#
# Diff this against configs/frontier_campaign.conf: it is the same campaign, on
# the same dispatches, with the event class swapped and the instance axis cut to
# one case.  The keys that differ are marked CHANGED and nothing else moves, so
# a difference in the numbers is a difference in the EVENT CLASS.  The arguments
# for beta = 1 and for scoring this tree are written out in that file and in
# COUNTERFACTUAL_STANDARD.md; they are not restated here.

frontier_dir    = results/frontier_v1
frontier_suffix = _frontier

instances = activs200            # CHANGED: one case first, 500 and 2k after
metrics   = max_active_flow, joule_loss_max, bus_flow_sum_agg
stages    = baseline             # Knitro is unlicensed; see frontier_campaign.conf

# ---------------------------------------------------------------------------
# Section 4: the campaign, class (b) only.
# ---------------------------------------------------------------------------
gen_k       =                    # CHANGED: class (a) off
walk_k      = 2, 4, 8            # CHANGED: the ACTIVSg500 grid, not 5, 15, 40
walk_draws  = 100
walk_seed   = 20260820           # the seed the ladder declares; unchanged
vendor_list = false              # CHANGED: class (c) off, that is the other tree
beta        = 1

# GAMMA IS SWEPT HERE AND WAS NOT IN THE VENDOR RUN.  The vendor list is
# branch-only, so gamma = 0 costs nothing there: nothing is removed from either
# side and there is no deficit to redistribute.  A walk removes BUSES, and with
# Pg pinned at P* every draw that takes a unit is infeasible in phase 1 by
# construction and its lost load is the generation deficit almost mechanically
# -- Section 4.1 of the standard.  So gamma = 0 is kept only as the anchor that
# lines this tree up with results/frontier_campaign/, and the signal is expected
# at the two positive points.
gamma = 0, 0.25, 0.5

# ---------------------------------------------------------------------------
# Section 4.2: the frequency screen.  The same four unsourced constants the
# vendor tree ran at, and they have to stay that way for the trees to compare.
# CITE markers stand.
# ---------------------------------------------------------------------------
f0_hz            = 60.0     # CITE: the .RAW BASFRQ field
rocof_max_hz_s   = 0.5      # CITE: a grid-code RoCoF withstand limit
f_under_hz       = 59.3     # CITE: the first UFLS stage
damping_per_load = 1.0      # CITE: the textbook 1-2 %/%, on the LOAD base
horizon_s        = 30.0
dt_s             = 0.01

dynamics_search = data

solver_dc    = gurobi
threads      = 16
time_limit_s = 3600

outdir            = results/frontier_walk200_k248   # CHANGED: its own tree
stale_claim_hours = 24
