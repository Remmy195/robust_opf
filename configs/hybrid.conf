# MATPOWER file; bare name looked up in data/
case = case_ACTIVSg200
# exposure representation: max_active_flow, joule_loss_max, bus_flow_sum_agg
metric = max_active_flow
# a2 adds the hybrid AC solve on top of the DC baseline
stage = a2
# rated drops branches with no rateA from the representation (default all)
# flow_domain = all
# order: mean of the q largest contributions (default 1)
# q = 1
# exposure weight as a multiple of lambda_ref = z0/rho0; 0 gives the plain OPF
weight_multiplier = 1
# absolute exposure weight; overrides weight_multiplier
# risk_weight =
# cuts per iteration
kappa = 5
# stop when rho/rho0 <= 1 - eta
eta = 0.85
# iteration limit
k_bar = 40
# stop when the gap Gamma <= gamma_tol
gamma_tol = 1e-6
# DC master solver (default gurobi)
# solver_dc = gurobi
# AC solver for the a2 stage (default knitro); ipopt also supported
solver_ac = knitro
# extra AMPL solver options for the DC solve, e.g. numericfocus=3
# solver_dc_options =
# extra AMPL solver options for the AC solve
# solver_ac_options =
# per-solve time limit in seconds (default 3600)
# time_limit_s = 3600
# solver thread count (default: solver default)
# threads =
# echo solver output (default false)
solver_verbose = true
# write each master solve to lp/ as an LP file; DC solvers only (default false)
# write_lp = false
# output directory (default results/<case>_<metric>_<stage>)
# outdir =
