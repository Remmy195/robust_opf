# Phase 2 of the de-risking cost-exposure frontier characterization.
# Cell ACTIVSg10k / max_active_flow, stage a2, at kappa = 2, eta = 0.8, k_bar = 15.
#
# THE GRID IS THE PHASE-1 TRACE OF THIS CELL, measured on stage baseline and
# reused verbatim by all three stages so that a2 and a3 are paired with the
# baseline at matched lambda.  Trace: results/frontier_v1/_traces/ACTIVSg10k_max_active_flow_trace/frontier_trace.json
#   walk capped; point_budget (16 points solved, the limit is frontier_max_points = 16; the longest chord left unsplit is 0.498032)
#   16 points in 16 solves, 766.3s
#
# This config runs the frontier ONLY.  No Section 4 campaign is reachable from
# `ropf solve`.

case   = data/case_ACTIVSg10k.m
metric = max_active_flow
stage  = a2

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

weight_grid = 0, 0.001, 0.002, 0.0039, 0.0078, 0.0156, 0.0312, 34

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

tag    = ACTIVSg10k_max_active_flow_a2_frontier
outdir = results/frontier_v1
