# Phase 1 of the de-risking cost-exposure frontier characterization.
# ONE (instance, metric) cell, stage baseline, at kappa = 2, eta = 0.8, k_bar = 15.
# `ropf trace` reads this to RECOMMEND a weight_grid; it solves no campaign and
# writes no study artifact.  The weight_grid below is the tracer's own input
# default and is NOT read by the trace -- see `ropf.study.frontier`.

case   = data/case_ACTIVSg70k.m
metric = joule_loss_max
stage  = baseline

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

frontier_seed           = 0.01
frontier_hi_cap         = 64
frontier_max_points     = 16
frontier_tol            = 0.02
frontier_saturation_tol = 0.002
frontier_grid_points    = 8

# NUMERIC HARDENING, ADDED AFTER ATTEMPT 1 FAILED.  Attempt 1 died at the very
# first walk point (lambda = 0.25 lambda*) with Gurobi returning `solved?` at
# k = 7 -- while the run was ALREADY converged: Gamma was 0.000000 at k = 5 and
# k = 6 and rho sat at 0.201078.  The status was ambiguous, not the answer.
# This functional is the worst-scaled of the three at this instance: the objective
# carries a cost near 1.5e7 alongside Phi near 0.2.  Evidence:
# study/frontier_v1_logs/ACTIVSg70k_joule_loss_max_trace.FAILED-attempt1.log
# Neither key is a locked study parameter and neither changes the model.
gurobi_numericfocus = 3
gurobi_scaleflag    = 2

# TRACER RETUNED AFTER THE SOLVER ROUTE FAILED.
# Attempt 1 (default numerics) and attempt 2 (hardened) both died at the
# FIRST walk point, lambda = 0.25 lambda*, while ALREADY converged (Gamma
# = 0.000000 at k = 5 and k = 6). A saturation tolerance cannot help a
# walk that never took a second step, so the seed moves instead: at 0.01
# the first step prices risk 25x lower, which is where this functional's
# bend sits anyway (ACTIVSg10k/joule traced its grid over 0.002 to
# 0.0625).

tag    = ACTIVSg70k_joule_loss_max
outdir = results/frontier_v1/_traces
