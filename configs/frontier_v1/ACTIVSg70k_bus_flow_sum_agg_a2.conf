# Phase 2 of the de-risking cost-exposure frontier characterization.
# Cell ACTIVSg70k / bus_flow_sum_agg, stage a2, at kappa = 2, eta = 0.8, k_bar = 15.
#
# THE GRID IS THE PHASE-1 TRACE OF THIS CELL, measured on stage baseline and
# reused verbatim by all three stages so that a2 and a3 are paired with the
# baseline at matched lambda.  Trace: results/frontier_v1/_traces/ACTIVSg70k_bus_flow_sum_agg_trace/frontier_trace.json
#   walk capped; point_budget (16 points solved, the limit is frontier_max_points = 16; the longest chord left unsplit is 0.213201)
#   16 points in 16 solves, 5096.1s
#
# This config runs the frontier ONLY.  No Section 4 campaign is reachable from
# `ropf solve`.

case   = data/case_ACTIVSg70k.m
metric = bus_flow_sum_agg
stage  = a2

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

weight_grid = 0, 0.0039, 0.0078, 0.0156, 0.0312, 0.0469, 0.0938, 8.4375

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

tag    = ACTIVSg70k_bus_flow_sum_agg_a2_frontier
outdir = results/frontier_v1
