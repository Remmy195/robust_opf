# Phase 2 of the de-risking cost-exposure frontier characterization.
# Cell ACTIVSg500 / bus_flow_sum_agg, stage a2, at kappa = 2, eta = 0.8, k_bar = 15.
#
# THE GRID IS THE PHASE-1 TRACE OF THIS CELL, measured on stage baseline and
# reused verbatim by all three stages so that a2 and a3 are paired with the
# baseline at matched lambda.  Trace: results/frontier_v1/_traces/ACTIVSg500_bus_flow_sum_agg_trace/frontier_trace.json
#   walk saturated; point_budget (16 points solved, the limit is frontier_max_points = 16; the longest chord left unsplit is 0.358647)
#   16 points in 16 solves, 56.7s
#
# This config runs the frontier ONLY.  No Section 4 campaign is reachable from
# `ropf solve`.

case   = data/case_ACTIVSg500.m
metric = bus_flow_sum_agg
stage  = a2

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

weight_grid = 0, 0.3281, 0.3359, 0.3438, 0.9375, 1, 2

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

tag    = ACTIVSg500_bus_flow_sum_agg_a2_frontier
outdir = results/frontier_v1
