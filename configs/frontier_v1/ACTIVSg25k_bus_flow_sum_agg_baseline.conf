# Phase 2 of the de-risking cost-exposure frontier characterization.
# Cell ACTIVSg25k / bus_flow_sum_agg, stage baseline, at kappa = 2, eta = 0.8, k_bar = 15.
#
# THE GRID IS THE PHASE-1 TRACE OF THIS CELL, measured on stage baseline and
# reused verbatim by all three stages so that a2 and a3 are paired with the
# baseline at matched lambda.  Trace: results/frontier_v1/_traces/ACTIVSg25k_bus_flow_sum_agg_trace/frontier_trace.json
#   walk saturated; point_budget (16 points solved, the limit is frontier_max_points = 16; the longest chord left unsplit is 0.269330)
#   16 points in 16 solves, 1729.3s
#
# This config runs the frontier ONLY.  No Section 4 campaign is reachable from
# `ropf solve`.

case   = data/case_ACTIVSg25k.m
metric = bus_flow_sum_agg
stage  = baseline

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

weight_grid = 0, 0.0078, 0.0117, 0.0156, 0.0312, 0.0625, 0.125, 8

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

tag    = ACTIVSg25k_bus_flow_sum_agg_baseline_frontier
outdir = results/frontier_v1
