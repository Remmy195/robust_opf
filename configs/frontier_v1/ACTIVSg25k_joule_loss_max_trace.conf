# Phase 1 of the de-risking cost-exposure frontier characterization.
# ONE (instance, metric) cell, stage baseline, at kappa = 2, eta = 0.8, k_bar = 15.
# `ropf trace` reads this to RECOMMEND a weight_grid; it solves no campaign and
# writes no study artifact.  The weight_grid below is the tracer's own input
# default and is NOT read by the trace -- see `ropf.study.frontier`.

case   = data/case_ACTIVSg25k.m
metric = joule_loss_max
stage  = baseline

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

frontier_seed           = 0.25
frontier_hi_cap         = 64
frontier_max_points     = 16
frontier_tol            = 0.02
frontier_saturation_tol = 0.002
frontier_grid_points    = 8

# NUMERIC HARDENING, ADDED AFTER ATTEMPT 1 FAILED.
# Attempt 1 died at lambda = 16 lambda* with Gurobi returning 'solved?'. The walk had reached tau = 0.2588 (a 74% reduction) over seven clean points before the status went ambiguous.
# Evidence: study/frontier_v1_logs/ACTIVSg25k_joule_loss_max_trace.FAILED-attempt1.log
# Neither key is a locked study parameter and neither changes the model.
gurobi_numericfocus = 3
gurobi_scaleflag    = 2

# TRACER RETUNED AFTER THE SOLVER ROUTE FAILED.
# Attempt 1 died at lambda = 16 lambda* with `solved?` after seven clean
# points. Same shape as this instance's flow cell: tau falls 1.000000 ->
# 0.288639 across lambda 0 -> 0.25, then the drop is 0.000575 by lambda =
# 4. At a 0.002 tolerance the walk stops there, before the ill-conditioned
# region, and refines the bend instead.

tag    = ACTIVSg25k_joule_loss_max
outdir = results/frontier_v1/_traces
