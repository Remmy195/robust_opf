# Phase 1 of the de-risking cost-exposure frontier characterization.
# ONE (instance, metric) cell, stage baseline, at kappa = 2, eta = 0.8, k_bar = 15.
# `ropf trace` reads this to RECOMMEND a weight_grid; it solves no campaign and
# writes no study artifact.  The weight_grid below is the tracer's own input
# default and is NOT read by the trace -- see `ropf.study.frontier`.

case   = data/case_ACTIVSg25k.m
metric = max_active_flow
stage  = baseline

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

frontier_seed           = 0.25
frontier_hi_cap         = 64
frontier_max_points     = 16
frontier_tol            = 0.02
frontier_saturation_tol = 0.002
frontier_grid_points    = 8

# NUMERIC HARDENING, ADDED AFTER ATTEMPT 1 FAILED.  The first trace of this
# cell died at lambda = 8 lambda* with Gurobi returning the ambiguous status
# `solved?` at k = 18 (evidence: study/frontier_v1_logs/
# ACTIVSg25k_max_active_flow_trace.FAILED-attempt1.log).  That is the exact
# case `ropf.model.SolverConfig` documents these two keys for.  Neither is a
# locked study parameter and neither changes the model: they buy numerical
# care at the cost of speed.  This cell is the ONLY one carrying them, and the
# difference is recorded in its own solution_summary.json config block.
gurobi_numericfocus = 3
gurobi_scaleflag    = 2

# TRACER RETUNED AFTER THE SOLVER ROUTE FAILED.
# Attempt 1 (default numerics) and attempt 2 (NumericFocus=3, ScaleFlag=2)
# BOTH died at lambda = 8 lambda* with Gurobi's ambiguous `solved?`,
# returning tau identical to six significant figures -- so the failure is
# not one the solver options reach. It is the WALK that is wrong here: tau
# falls 1.000000 -> 0.628895 across lambda 0 -> 0.25 (97% of the whole
# trade-off) and then moves 0.09% per doubling. The frontier is saturated
# at lambda = 4; the walk only continued to lambda = 8 because the last
# drop, 0.00094, sat just above the 0.0005 tolerance. At 0.002 the walk
# stops at lambda = 4 and the point budget goes where the bend actually
# is.

tag    = ACTIVSg25k_max_active_flow
outdir = results/frontier_v1/_traces
