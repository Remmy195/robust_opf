# Phase 2 of the de-risking cost-exposure frontier characterization.
# Cell ACTIVSg500 / max_active_flow, stage a3, at kappa = 2, eta = 0.8, k_bar = 15.
#
# THE GRID IS THE PHASE-1 TRACE OF THIS CELL, measured on stage baseline and
# reused verbatim by all three stages so that a2 and a3 are paired with the
# baseline at matched lambda.  Trace: results/frontier_v1/_traces/ACTIVSg500_max_active_flow_trace/frontier_trace.json
#   walk capped; point_budget (16 points solved, the limit is frontier_max_points = 16; the longest chord left unsplit is 0.282659)
#   16 points in 16 solves, 46.1s
#
# This config runs the frontier ONLY.  No Section 4 campaign is reachable from
# `ropf solve`.

case   = data/case_ACTIVSg500.m
metric = max_active_flow
stage  = a3

kappa = 2
eta   = 0.8
k_bar = 15
gamma_tol = 1e-6

weight_grid = 0, 0.125, 0.25, 0.375, 0.5, 3.0918, 3.4609

solver_dc    = gurobi
solver_ac    = knitro
threads      = 16
time_limit_s = 3600

tag    = ACTIVSg500_max_active_flow_a3_frontier
outdir = results/frontier_v1
