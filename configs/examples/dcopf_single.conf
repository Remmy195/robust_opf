# Plain DC OPF, one solve. weight_grid = 0 -> zero_weight termination, no
# cutting-plane loop. ropf solve configs/examples/dcopf_single.conf

case   = data/case_ACTIVSg200.m
metric = max_active_flow
stage  = baseline

weight_grid = 0

kappa = 2
eta   = 0.8
k_bar = 15

solver_dc = gurobi
threads   = 4

outdir = results/examples/dcopf_single
