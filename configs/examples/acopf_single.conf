# Plain AC OPF, one solve. stage = a3 runs (M^ac) directly; weight_grid = 0 ->
# zero_weight termination, no cutting-plane loop. Needs Knitro or Ipopt.

case   = data/case_ACTIVSg200.m
metric = max_active_flow
stage  = a3

weight_grid = 0

kappa = 2
eta   = 0.8
k_bar = 15

solver_ac = knitro
threads   = 4

outdir = results/examples/acopf_single
